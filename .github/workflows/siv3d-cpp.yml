name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y cmake ninja-build

      - name: Build with Siv3D
        run: |
          cmake -B build -G Ninja
          cmake --build build

lint:
  runs-on: ubuntu-latest
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install lint tools
      run: sudo apt update && sudo apt install -y clang-format clang-tidy

    - name: Run clang-format check
      run: find . -name "*.cpp" -o -name "*.h" | xargs clang-format --dry-run --Werror
      
    - name: Run clang-tidy check
      run: clang-tidy $(find . -name "*.cpp") -- -std=c++23
